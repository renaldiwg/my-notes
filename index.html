<!DOCTYPE html>
<html>
    <head>
        <title>My Notes</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body>
        <div class="flex justify-center">
            <div class="border border-gray-300 h-fit w-full max-w-6xl">
                <div class="bg-blue-200 p-5 text-2xl">
                    <p>My Notes</p>
                </div>

                <div class="p-3">
                    <textarea class="p-3 w-full border border-blue-400 rounded focus:border-blue-700 focus:shadow-lg focus:outline-none" name="input" id="input" placeholder="Masukkan teks..."></textarea>

                    
                    <button class="border border-blue-700 bg-blue-500 rounded p-1 my-2 text-white" id="save">Simpan</button>
                    <button class="border border-yellow-700 bg-yellow-500 rounded p-1 my-2 " id="cancel">Cancel</button>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-4" id="hasil"></div>
                </div>
                
                
            </div>
            

        </div>

        <script src="script.js"></script>
    </body>
</html>
